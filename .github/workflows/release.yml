name: Release

# Publish both packages when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# One-time setup (see docs/RELEASING.md):
#   - npm:  add an automation token as the NPM_TOKEN repo secret.
#   - PyPI: configure a Trusted Publisher (OIDC) for project "airlock-hitl"
#           pointing at this repo + workflow "release.yml" — no secret needed.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  npm:
    name: Publish @fedorello/airlock to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/ts/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: Publish airlock-hitl to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
    defaults:
      run:
        working-directory: packages/py
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/py/dist
