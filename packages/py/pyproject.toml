[project]
name = "airlock-hitl"
version = "0.1.0"
description = "A human-approval gate for the dangerous things an AI agent does."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Fedor Chishchin" }]
keywords = ["ai", "agent", "llm", "human-in-the-loop", "approval", "tool-use", "guardrails"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "redis>=8.0.1",
  "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/fedorello/airlock"
Repository = "https://github.com/fedorello/airlock"
Issues = "https://github.com/fedorello/airlock/issues"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.19",
  "mypy>=2.1.0",
  "import-linter>=2.12",
]

[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "DTZ", "PT", "RET", "C4", "TID", "ANN", "PLR"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/eval"]
addopts = "--cov=airlock --cov-report=term-missing --cov-branch --cov-fail-under=90"

[tool.coverage.run]
omit = [
  "src/airlock/infrastructure/events/redis_event_bus.py",
  "src/airlock/infrastructure/store/redis_run_store.py",
  "src/airlock/interface/approver/cli_decision_source.py",
]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[tool.importlinter]
root_package = "airlock"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers point inward"
type = "layers"
layers = ["airlock.interface | airlock.infrastructure", "airlock.application", "airlock.domain"]

[[tool.importlinter.contracts]]
name = "Core stays free of infrastructure libraries"
type = "forbidden"
source_modules = ["airlock.domain", "airlock.application"]
forbidden_modules = ["redis", "httpx", "pydantic_settings"]
